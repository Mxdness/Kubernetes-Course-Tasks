apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: webapp-stack
  labels:
    app: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate   
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: webapp-mysql:task2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-user
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-password
            - name: APP_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: webapp-config
                  key: MYSQL_DATABASE
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
